<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <title>Mensaje enviado | Psic. Luis Alberto Morales Pérez</title>
  <meta name="robots" content="noindex">

  <style>
    .thanks-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, var(--sand-50) 0%, var(--teal-100) 100%);
      padding: 24px;
    }
    .thanks-card {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow-lg);
      padding: 56px 44px;
      max-width: 520px;
      text-align: center;
    }
    .thanks-card .check {
      width: 82px; height: 82px;
      border-radius: 50%;
      background: var(--teal-100);
      color: var(--teal-700);
      font-size: 2.4rem;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
    }
    .thanks-card p { color: var(--ink-soft); margin: 14px 0 28px; }
  </style>
</head>
<body>
  <div class="thanks-wrap">
