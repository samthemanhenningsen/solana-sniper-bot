name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [claude/website-netlify-builder-9e220g]
    paths:
      - "sites/psic-luis-morales/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/psic-luis-morales
      - id: deployment
        uses: actions/deploy-pages@v4
