<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-label="Consultorio privado en Mexicali">
  <rect width="420" height="300" rx="18" fill="#ddeeeb"/>

  <!-- building -->
  <rect x="110" y="70" width="200" height="180" rx="10" fill="#faf6ef" stroke="#1d5f57" stroke-width="4"/>
  <rect x="110" y="70" width="200" height="34" rx="10" fill="#1d5f57"/>
  <text x="210" y="94" font-family="Georgia, serif" font-size="17" fill="#faf6ef" text-anchor="middle">Consultorio</text>

  <!-- door -->
  <rect x="186" y="168" width="48" height="82" rx="6" fill="#2e8077"/>
  <circle cx="224" cy="212" r="4" fill="#f6c98f"/>

  <!-- windows -->
  <rect x="130" y="122" width="40" height="34" rx="5" fill="#ddeeeb" stroke="#1d5f57" stroke-width="3"/>
  <rect x="250" y="122" width="40" height="34" rx="5" fill="#ddeeeb" stroke="#1d5f57" stroke-width="3"/>
  <line x1="150" y1="122" x2="150" y2="156" stroke="#1d5f57" stroke-width="3"/>
  <line x1="270" y1="122" x2="270" y2="156" stroke="#1d5f57" stroke-width="3"/>

  <!-- sun -->
  <circle cx="66" cy="58" r="24" fill="#f6c98f"/>
  <g stroke="#e8a76a" stroke-width="3" stroke-linecap="round">
    <line x1="66" y1="20" x2="66" y2="30"/>
    <line x1="66" y1="86" x2="66" y2="96"/>
    <line x1="28" y1="58" x2="38" y2="58"/>
    <line x1="94" y1="58" x2="104" y2="58"/>
  </g>

  <!-- desert plants (Mexicali) -->
  <g fill="#2e8077">
    <rect x="58" y="196" width="12" height="54" rx="6"/>
    <rect x="44" y="210" width="10" height="20" rx="5"/>
    <rect x="48" y="224" width="14" height="8" rx="4"/>
    <rect x="70" y="204" width="10" height="22" rx="5"/>
    <rect x="62" y="218" width="14" height="8" rx="4"/>
  </g>
  <g fill="#1d5f57">
    <rect x="346" y="206" width="11" height="44" rx="5.5"/>
    <rect x="334" y="216" width="9" height="18" rx="4.5"/>
    <rect x="338" y="228" width="12" height="7" rx="3.5"/>
  </g>

  <!-- ground -->
  <path d="M20 250 H400" stroke="#c9b892" stroke-width="6" stroke-linecap="round"/>
  <path d="M40 266 H120 M300 266 H386" stroke="#c9b892" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
</svg>
